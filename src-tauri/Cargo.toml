[package]
name = "nsurvey-pro"
version = "1.0.0"
description = "NSurvey PRO — Professional Geomatics CAD & Cadastral Computation Suite"
authors = ["NSurvey Engineering Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
